name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Re-enable when macos-26 is no longer in preview
    # See: https://github.com/actions/runner-images
    # runs-on: macos-latest
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create build directory
        run: mkdir -p build

      - name: Import Developer ID Certificate
        run: |
          echo "${{ secrets.DEVELOPER_ID_P12 }}" | base64 --decode > build/DeveloperID.p12
          security create-keychain -p "" build.keychain
          security import build/DeveloperID.p12 -k build.keychain -P "${{ secrets.DEVELOPER_ID_P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      - name: Configure keychain for codesign
        run: |
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.JIRAIYA_PROVISIONING_PROFILE }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Jiraiya.provisionprofile

      - name: Build and Archive App
        run: |
          set -o pipefail
          test -n "${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"
          xcodebuild -project "Jiraiya/Jiraiya.xcodeproj" \
            -scheme "Jiraiya" \
            -configuration Release \
            -archivePath "$PWD/build/Jiraiya.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -destination "platform=macOS,arch=arm64" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT="dwarf" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Developer ID Application: Victor Noagbodji (2DZ6D8C78T)" \
            SPARKLE_PUBLIC_ED_KEY="${{ secrets.SPARKLE_PUBLIC_ED_KEY }}" \
            archive

      - name: Export App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Jiraiya.xcarchive" \
            -exportOptionsPlist "$PWD/Jiraiya/Jiraiya/ExportOptions.plist" \
            -exportPath "$PWD/build"

      - name: Notarize app
        run: |
          ditto -c -k --keepParent "build/Jiraiya.app" "build/Jiraiya.zip"
          xcrun notarytool submit "build/Jiraiya.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" \
            --wait
          xcrun stapler staple "build/Jiraiya.app"

      - name: Create DMG
        run: |
          rm -rf build/dmg-staging "build/Jiraiya.dmg"
          mkdir -p build/dmg-staging
          ditto "build/Jiraiya.app" "build/dmg-staging/Jiraiya.app"
          ln -s /Applications build/dmg-staging/Applications
          for attempt in 1 2 3; do
            if hdiutil create -volname "Jiraiya" \
              -srcfolder "build/dmg-staging" \
              -fs HFS+ -ov -format UDZO "$PWD/build/Jiraiya.dmg"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "hdiutil failed after 3 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt failed, retrying"
            sleep 5
          done
          ls -la "build/Jiraiya.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p build/sparkle-updates
          cp "build/Jiraiya.dmg" "build/sparkle-updates/Jiraiya.dmg"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > build/sparkle_ed25519.key
          chmod 600 build/sparkle_ed25519.key
          build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file build/sparkle_ed25519.key \
            --download-url-prefix "https://github.com/nvictor/macos-releases/releases/download/jiraiya-${GITHUB_REF_NAME}/" \
            build/sparkle-updates

      - name: Publish to macos-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          gh release create "jiraiya-$TAG" "build/Jiraiya.dmg" build/sparkle-updates/*.delta \
            --repo nvictor/macos-releases \
            --title "Jiraiya $VERSION" \
            --notes "Jiraiya $VERSION"
          git clone "https://x-access-token:$GH_TOKEN@github.com/nvictor/macos-releases.git" build/releases
          mkdir -p "build/releases/Jiraiya"
          cp build/sparkle-updates/appcast.xml "build/releases/Jiraiya/appcast.xml"
          cd build/releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Jiraiya/appcast.xml"
          git commit -m "Publish Jiraiya $VERSION"
          git push origin main
